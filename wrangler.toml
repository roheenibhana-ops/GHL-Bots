name = "ghl-bots"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Cron: pulls the next outreach batch. Does nothing unless SENDING_ENABLED = "true".
[triggers]
crons = ["*/10 * * * *"]

[vars]
# Safety switches. Keep sending OFF until the pilot is approved.
SENDING_ENABLED = "false"
# "approve" = every outbound message waits for a human tap in the app. "auto" = send directly.
SEND_MODE = "approve"
# Max messages released per cron run.
BATCH_SIZE = "10"
# Local send window (contact timezone), 24h clock.
QUIET_START_HOUR = "20"
QUIET_END_HOUR = "9"
# Daily batch sender: texts per day (0 = none) and which campaign it sends.
DAILY_CAP = "0"
BATCH_CAMPAIGN = "pilot-2"
CLAUDE_MODEL = "claude-haiku-5-5"
# Bot: "off" = only capture replies | "test" = reply only to contacts tagged bot-test | "live" = reply to everyone.
BOT_MODE = "test"
# Photo handler: "off" | "test" (only contacts tagged bot-test) | "live".
PHOTO_MODE = "test"
# The bots only ever touch opportunities in these pipelines (comma separated names).
BOT_PIPELINES = "Gutter Promo Nurture Pipeline 2027, Lead Nurture Pipeline 2027, Christmas Lighting Nurture"
PROMO_PIPELINE = "Gutter Promo Nurture Pipeline 2027"
# The campaign tag, added to each contact when their promo text is approved and sent.
BOT_TAG = "winter promo"
# Model for the sales conversation.
BOT_MODEL = "claude-sonnet-5-5"
# "alert" = tell the team a quote is ready | "draft" = also create a draft quote in Dunzo Jobber | "link" = create the quote, mark it sent and text the customer the link (they enter their email to sign in).
QUOTE_MODE = "link"
# Local hours the bot may text (contact timezone).
BOT_START_HOUR = "8"
BOT_END_HOUR = "21"
# Jobber GraphQL version header (must be a version Jobber supports; change here if rejected).
JOBBER_API_VERSION = "2025-01-20"

# Secrets (set with `wrangler secret put <NAME>`, never commit):
#   GHL_TOKEN_LIGHTS, GHL_LOCATION_LIGHTS
#   GHL_TOKEN_DUNZO,  GHL_LOCATION_DUNZO
#   SUPABASE_URL, SUPABASE_SERVICE_KEY
#   ANTHROPIC_API_KEY
#   ADMIN_TOKEN        (protects /admin/* routes)
#   WEBHOOK_SECRET     (GHL webhook must send ?secret=...)
#   JOBBER_CLIENT_ID, JOBBER_CLIENT_SECRET
#   ALERT_PHONE        (optional: who gets handoff and quote alerts by text)
